# Default configuration. These are the reference settings; override any of
# them on the command line with --set, e.g. --set train.max_epochs=2.

# ===== Data =====
data:
  csv_path: data/dataset.csv   # patient_id, front_path, lateral_path,
                               # age, sex, risser, cobb_baseline, label
  num_workers: 4
  batch_size: 32

# ===== Cross-validation =====
cross_validation:
  num_reps: 10          # repetitions of the whole 10-fold procedure
  num_folds: 10         # 1 test fold, 1 fold's worth of validation, 8 for training
  seed: 42              # outer split: seed+r-1; model seed: SeedSequence(seed,r,fold)

# ===== Image models =====
image:
  archs:                # short name -> timm architecture (384 x 384 input)
    vit: vit_base_patch16_384.augreg_in21k_ft_in1k
    swint: swin_base_patch4_window12_384.ms_in22k_ft_in1k
    convnextv2: convnextv2_base.fcmae_ft_in22k_in1k_384
  num_classes: 2
  hidden_dim: 512       # shared head: LayerNorm -> Linear -> GELU -> Dropout -> Linear
  dropout: 0.5
  pretrained: true      # ImageNet weights
  freeze_backbone: false

# ===== Image training =====
train:
  max_epochs: 100
  min_epochs: 10             # early stopping cannot fire before this
  lr: 1.0e-5
  weight_decay: 1.0e-3
  warmup_epochs: 5           # linear warmup, then cosine annealing
  early_stopping_patience: 5 # consecutive epochs without val_loss improvement
  use_class_weights: true    # inverse frequency, from the training subset only
  precision: "16-mixed"      # bf16-mixed | 16-mixed | 32-true.
                             #   16-mixed  : the reference setting.
                             #   bf16-mixed: wider dynamic range on Ampere+ GPUs.
                             #   32-true   : strict reproducibility; mixed precision
                             #               is not bit-reproducible across GPUs.
                             # Inference always runs in fp32.
  matmul_precision: "high"   # torch fp32 matmul mode: highest | high | medium.
                             # "high" enables TF32 on Ampere+, as in the reference runs.
  deterministic: true        # deterministic algorithms + cuDNN where supported

# ===== Augmentation (training folds only) =====
augment:
  horizontal_flip: true      # p = 0.5
  random_resized_crop: true
  rrc_scale: [0.5, 1.0]      # crop area, 50-100% of the image
  rrc_ratio: [1.0, 1.0]      # aspect ratio fixed at 1:1

# ===== Clinical models =====
clinical:
  numeric_features: [age, cobb_baseline]   # z-scored
  binary_features: [sex]                   # one-hot; 1 = male, 2 = female
  ordinal_features: [risser]               # ordinal, Risser 0-5
  n_trials: 30              # Optuna trials per outer fold
  inner_folds: 10           # inner stratified K-fold for the search

# ===== Ensemble =====
ensemble:
  n_trials: 30
  inner_folds: 10

# ===== Final (deployable) model =====
# Trained on the whole cohort; the epoch count comes from the cross-validation
# runs, so there is no validation fraction to set here.
final:
  seed: 42              # each member derives a stable seed from this and its name

# ===== Output =====
output:
  dir: outputs        # cv/<modality>_<model>/, ensemble/<method>/, final/
