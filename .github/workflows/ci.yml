name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - run: uv pip install --reinstall --no-deps dist/*.whl
      - name: Verify installed entry points
        run: |
          uv run ais-build-dataset --help
          uv run ais-preprocess --help
          uv run ais-cv-modality --help
          uv run ais-cv-ensemble --help
          uv run ais-train-final --help
          uv run ais-predict --help
          uv run ais-gradcam --help
