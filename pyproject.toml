[project]
name = "ais-progression-classifier"
version = "0.4.0"
description = "Multimodal ensemble prediction of curve progression in idiopathic scoliosis from frontal and lateral spine radiographs and clinical variables"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ichikawa Lab" }]
# 3.11 is the floor because the test suite reads pyproject.toml with tomllib,
# which is stdlib only from 3.11.
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pytorch-lightning>=2.2",
    "timm>=1.0",
    "opencv-python-headless>=4.9",
    "pandas>=2.0",
    "numpy>=1.26",
    # Upper bound is deliberate: the Optuna search spaces use
    # LogisticRegression(penalty=...) and SVC(probability=True), which
    # scikit-learn deprecated in 1.8/1.9 and removes in 1.10/1.11.
    "scikit-learn>=1.4,<1.10",
    "optuna>=3.6",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "grad-cam>=1.5",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/ichikawalab/ais-progression-classifier"

# torch is resolved from PyPI, whose Windows wheels are CPU-only. GPU users
# replace them after `uv sync`, from PyTorch's own index:
#   uv pip install --reinstall torch torchvision --index-url https://download.pytorch.org/whl/cu130
# The CUDA variant must exist for the pinned torch version on your platform --
# torch 2.12 publishes cu130 for Windows, not cu128/cu129. That command does not
# update uv.lock, so the next `uv sync` restores the CPU wheels.
# See https://pytorch.org/get-started/locally/ for the current index URLs.

[project.scripts]
ais-build-dataset = "ais_progression.cli.build_dataset:main"
ais-preprocess = "ais_progression.cli.preprocess:main"
ais-cv-modality = "ais_progression.cli.cv_modality:main"
ais-cv-ensemble = "ais_progression.cli.cv_ensemble:main"
ais-train-final = "ais_progression.cli.train_final:main"
ais-predict = "ais_progression.cli.predict:main"
ais-gradcam = "ais_progression.cli.gradcam:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ais_progression"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Beyond the defaults (E4/E7/E9/F): line length, import order, bugbear, and
# pyupgrade. Without an explicit select, `line-length` above was never enforced.
select = ["E", "W", "F", "I", "B", "UP"]
